[package]
name = "trongoscript-ruby"
version = "0.1.0"
edition = "2021"
authors = ["Durable Programming <oss@durableprogramming.com>"]
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "trongoscript"
crate-type = ["cdylib"]

[dependencies]
trongoscript-host = "0.1.1"
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = "0.9"
serde_json = "1.0"
