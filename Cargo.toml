[workspace]
resolver = "2"
members = [
    "crates/trongoscript",
    "crates/trongoscript-parser",
    "crates/trongoscript-stdlib",
    "crates/trongoscript-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Durable Programming <hello@durableprogramming.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/durable-oss/trongoscript"
description = "A YAMLScript-inspired DSL for producing nested data structures, written in Rust"

# `kani` is set by `cargo kani`, which is not part of a normal build, so
# rustc has no way to learn the name on its own.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.dependencies]
# Parsing
nom = "7.1"

# Plugin/registry
inventory = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Testing
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
